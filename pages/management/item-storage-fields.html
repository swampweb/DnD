<!-- Add these fields to the existing Item Catalog editor. -->
<fieldset class="wide"><legend>Storage Size and Access</legend><div class="bonus-grid"><label>Grid Width<input id="item-grid-width" type="number" min="1" max="12" value="1"></label><label>Grid Height<input id="item-grid-height" type="number" min="1" max="12" value="1"></label><label>Can Rotate<select id="item-can-rotate"><option value="true">Yes</option><option value="false">No</option></select></label><label>Pocket Eligible<select id="item-pocket-eligible"><option value="false">No</option><option value="true">Yes</option></select></label><label>Is Backpack<select id="item-is-backpack"><option value="false">No</option><option value="true">Yes</option></select></label></div></fieldset>
<fieldset class="wide" id="backpack-size-fields"><legend>Backpack Capacity</legend><div class="bonus-grid vital"><label>Columns<input id="item-backpack-columns" type="number" min="1" max="12" value="4"></label><label>Rows<input id="item-backpack-rows" type="number" min="1" max="12" value="4"></label></div></fieldset>
