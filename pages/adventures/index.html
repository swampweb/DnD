<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100f">
  <title>Adventurer Library | Three Realms Adventures</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/modal.css">
  <link rel="stylesheet" href="../../css/adventurer-library.css">
  <link rel="stylesheet" href="../../css/adventurer-rating-contrast.css">
</head>
<body>
  <div class="library-page-shell">
    <div id="site-navigation" data-active-page="adventures"></div>
    <main class="library-main" id="library-main" hidden>
      <header class="library-heading"><div><p class="library-kicker">Three Realms Compendium</p><h1>Adventurer Library</h1><p>Browse every available Class and Adventurer without entering Character Creation.</p></div><a class="library-create-link" href="../characters/create.html">Create Character</a></header>
      <section class="library-toolbar" aria-label="Adventurer filters"><label>Adventure<select id="library-adventure"><option value="viking">Viking Adventure</option></select></label><label>Class<select id="library-class"><option value="all">All Classes</option></select></label><label>Search<input id="library-search" type="search" placeholder="Search Adventurer, Class, role, or theme"></label><button id="library-clear" type="button">Clear Filters</button></section>
      <section class="library-summary" aria-live="polite"><div><span>Available Adventurers</span><strong id="library-count">0</strong></div><p id="library-status">Loading the Viking Adventurer Library...</p></section>
      <div id="library-results" class="library-results"></div>
    </main>
    <main class="library-access" id="library-access" hidden><h1>Sign In Required</h1><p>Sign in to browse the Adventurer Library.</p><a href="../../index.html">Return Home</a></main>
  </div>
  <div id="library-preview" class="library-preview-backdrop" hidden><section class="library-preview" role="dialog" aria-modal="true" aria-labelledby="library-preview-title"><button id="library-preview-close" class="library-preview-close" type="button" aria-label="Close preview">×</button><div id="library-preview-content"></div></section></div>
  <div class="toast" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/supabase.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/adventurer-library.js"></script>
  <script src="../../js/adventurer-rating-contrast.js"></script>
</body>
</html>
